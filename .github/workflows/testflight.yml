name: Publish TestFlight beta

on:
  workflow_dispatch:
    inputs:
      bootstrap_app:
        description: Create the Bundle ID and App Store Connect record first
        required: true
        type: boolean
        default: true
      bundle_id:
        description: Bundle ID (use the beta ID on Dias's personal account)
        required: true
        type: string
        default: kz.onetap.beta
      app_name:
        description: App Store Connect app name
        required: true
        type: string
        default: OneTap.kz Beta
      app_sku:
        description: App Store Connect SKU
        required: true
        type: string
        default: ONETAP-KZ-BETA-IOS

concurrency:
  group: onetap-testflight
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
      APP_NAME: ${{ inputs.app_name }}
      APP_SKU: ${{ inputs.app_sku }}
      MATCH_GIT_URL: https://github.com/tooyakov-art/onetap-kz-signing.git
      MATCH_GIT_BRANCH: certificates
      BUILD_NUMBER: ${{ github.run_number }}
      MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Check required Apple secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_BASE64 APPLE_TEAM_ID MATCH_PASSWORD MATCH_GIT_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

      - name: Create App Store Connect app record
        if: ${{ inputs.bootstrap_app }}
        run: bundle exec fastlane ios bootstrap
        working-directory: ios

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
        working-directory: ios
